name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Зависимости для тестов (X11/GL)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev
      - name: Тесты
        run: go test ./internal/...
      - name: Сборка Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/DroneEbla.exe ./cmd/droneebla
      - uses: actions/upload-artifact@v4
        with:
          name: DroneEbla-windows
          path: dist/DroneEbla.exe
